name: Build Android

# GeneralsX @build Flux Build 16/11/2026 Flux CI: the same full build as the local loop
# (scripts/build/android/build-dual-hz.sh, four engines: libmain/libmain60 Zero Hour,
# libgenerals/libgenerals60 Generals, plus libfluxwb) instead of upstream's single-engine job.
# The variant comes from the pushed sources themselves (android/app/build.gradle):
# a v*-community branch builds com.generalsx.flux.community, a v*-personal branch
# com.generalsx.flux.personal. The fork receives snapshot commits without history, so the
# engine build number comes from .github/flux-engine-build (see package-android-zh.sh).
# DXVK: the pinned fbraz3-dxvk gitlink is checked out clean; cmake/dx8.cmake applies all
# Patches/dxvk-*.patch at configure time and fails the build if one does not apply.

permissions:
  contents: read

on:
  push:
    branches:
      - 'v*-community'
      - 'v*-personal'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: apk (four engines, ${{ github.ref_name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      GX_UPDATE_CHANNEL: test
      NDK_VERSION: "27.2.12479018"
      CMDLINE_TOOLS_VERSION: "13114758"
      VCPKG_COMMIT: "42e4e33e1505c9f47b58c21e0f557c1571b751ee"
      GRADLE_VERSION: "8.9"
      # Both passes (60 Hz, then 30 Hz) compile every engine file with a different define, so
      # the cache must hold two full builds; the env value wins over the script's 3G config.
      CCACHE_MAXSIZE: 6G
      CCACHE_DIR: /home/runner/.cache/ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
                      /usr/local/share/chromium /usr/local/lib/node_modules || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Checkout DXVK (pinned gitlink, clean)
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 references/fbraz3-dxvk
          git -C references/fbraz3-dxvk submodule update --init --depth 1
          echo "DXVK pinned at $(git -C references/fbraz3-dxvk rev-parse HEAD)"
          test -z "$(git -C references/fbraz3-dxvk status --porcelain --ignore-submodules=all)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install host tools
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq || sudo apt-get update -qq || true
          sudo apt-get install -y -qq --no-install-recommends ninja-build meson pkg-config glslang-tools ccache
          # The build script and the caches below use /opt; make it ours before restoring into it.
          sudo mkdir -p /opt/android-sdk /opt/vcpkg /opt/fetchcontent-src
          sudo chown -R "$(id -u):$(id -g)" /opt/android-sdk /opt/vcpkg /opt/fetchcontent-src

      - name: Restore Android SDK
        id: cache-sdk
        uses: actions/cache/restore@v5
        with:
          path: /opt/android-sdk
          key: android-sdk-${{ env.CMDLINE_TOOLS_VERSION }}-ndk${{ env.NDK_VERSION }}-p35-bt35

      - name: Restore vcpkg
        id: cache-vcpkg
        uses: actions/cache/restore@v5
        with:
          path: |
            /opt/vcpkg
            !/opt/vcpkg/buildtrees
            !/opt/vcpkg/packages
            ~/.cache/vcpkg
          key: vcpkg-android-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json', 'cmake/triplets/arm64-android.cmake') }}
          restore-keys: |
            vcpkg-android-${{ env.VCPKG_COMMIT }}-

      - name: Restore FetchContent sources
        id: cache-fetch
        uses: actions/cache/restore@v5
        with:
          path: /opt/fetchcontent-src
          key: fetchcontent-${{ hashFiles('scripts/build/android/build-local-sandboxed.sh') }}

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: /home/runner/.cache/ccache
          key: ccache-android-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-android-${{ github.ref_name }}-
            ccache-android-

      - name: Engine build number
        run: |
          set -euo pipefail
          if [ -f .github/flux-engine-build ]; then
            N="$(tr -dc 0-9 < .github/flux-engine-build)"
          else
            N="$(git rev-list --count HEAD)"
          fi
          # A history-less checkout counts 1: refuse rather than ship an engine every OTA beats.
          if [ -z "${N}" ] || [ "${N}" -lt 100 ]; then
            echo "::error::engine build number '${N}' is not a real commit count (add .github/flux-engine-build)"
            exit 1
          fi
          echo "GX_ENGINE_BUILD=${N}" >> "$GITHUB_ENV"
          echo "Engine build number: ${N}"

      - name: Build (dual Hz, four engines)
        run: |
          set -o pipefail
          mkdir -p logs
          ./scripts/build/android/build-dual-hz.sh 2>&1 | tee logs/build-ci.log
          echo "compiler errors: $(grep -c ' error:' logs/build-ci.log || true)"

      - name: Verify engines and APK
        id: apk
        run: |
          set -euo pipefail
          # Same checks as the local loop: the stamp's fingerprint equals the tree's.
          STAMP_FP="$(sed -n 's/^fingerprint=//p' build/engines.stamp)"
          TREE_FP="$(./scripts/build/android/engine-fingerprint.sh)"
          [ -n "${STAMP_FP}" ] && [ "${STAMP_FP}" = "${TREE_FP}" ] \
            || { echo "::error::engines.stamp fingerprint differs from the tree"; exit 1; }
          cat build/engines.stamp
          APK=GeneralsXZH-android-local.apk
          [ -f "${APK}" ] || { echo "::error::no APK"; exit 1; }
          for lib in libmain.so libmain60.so libgenerals.so libgenerals60.so libfluxwb.so; do
            unzip -l "${APK}" "lib/arm64-v8a/${lib}" >/dev/null \
              || { echo "::error::${lib} missing from the APK"; exit 1; }
          done
          AAPT2="$(ls /opt/android-sdk/build-tools/*/aapt2 | tail -1)"
          BADGE="$("${AAPT2}" dump badging "${APK}" | head -1)"
          echo "${BADGE}"
          PKG="$(sed -n "s/.*package: name='\([^']*\)'.*/\1/p" <<< "${BADGE}")"
          CODE="$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<< "${BADGE}")"
          VNAME="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "${BADGE}")"
          case "${PKG}" in
            com.generalsx.flux.community) VARIANT=Community ;;
            com.generalsx.flux.personal)  VARIANT=Personal ;;
            *) echo "::error::unexpected applicationId ${PKG}"; exit 1 ;;
          esac
          NAME="GeneralsXZH-android-v${VNAME%%-*}-${CODE}-${VARIANT}.apk"
          mkdir -p out
          cp "${APK}" "out/${NAME}"
          (cd out && sha256sum "${NAME}" > "${NAME}.sha256" && cat "${NAME}.sha256")
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "### ${NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$(cut -c1-64 "out/${NAME}.sha256")\` (${PKG}, versionCode ${CODE}, engine build ${GX_ENGINE_BUILD})" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: out/
          retention-days: 14
          compression-level: 0

      - name: Upload symbol tables
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: symbols-${{ github.ref_name }}-${{ github.run_number }}
          path: build/symbols/
          retention-days: 30
          if-no-files-found: ignore

      - name: Collect logs
        if: always()
        run: |
          mkdir -p logs
          cp build/android-vulkan/vcpkg-manifest-install.log logs/ 2>/dev/null || true
          cp build/android-vulkan/_deps/dxvk-build-android/meson-logs/meson-log.txt logs/dxvk-meson-log.txt 2>/dev/null || true
          if [ -d /opt/vcpkg/buildtrees ]; then
            find /opt/vcpkg/buildtrees -maxdepth 2 -name '*.log' -exec cp {} logs/ \; 2>/dev/null || true
          fi
          df -h / || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ github.ref_name }}-${{ github.run_number }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Save Android SDK
        if: always() && steps.cache-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /opt/android-sdk
          key: android-sdk-${{ env.CMDLINE_TOOLS_VERSION }}-ndk${{ env.NDK_VERSION }}-p35-bt35

      - name: Save vcpkg
        if: always() && steps.cache-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            /opt/vcpkg
            !/opt/vcpkg/buildtrees
            !/opt/vcpkg/packages
            ~/.cache/vcpkg
          key: vcpkg-android-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json', 'cmake/triplets/arm64-android.cmake') }}

      - name: Save FetchContent sources
        if: always() && steps.cache-fetch.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /opt/fetchcontent-src
          key: fetchcontent-${{ hashFiles('scripts/build/android/build-local-sandboxed.sh') }}

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: /home/runner/.cache/ccache
          key: ccache-android-${{ github.ref_name }}-${{ github.run_id }}
